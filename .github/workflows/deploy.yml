name: Deploy FilmCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，避免 Fat LTO 链接时 OOM (Exit Code 143)
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. 安装现代 Binaryen (wasm-opt v122) 并创建 SIMD 包装器
      - name: Install Modern Binaryen & Setup SIMD Wrapper
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          
          sudo mv /usr/local/bin/wasm-opt /usr/local/bin/wasm-opt-raw
          printf '#!/bin/bash\nexec /usr/local/bin/wasm-opt-raw --all-features --enable-simd "$@"\n' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      # 5. 配置官方 zh-hans 简体中文词库并锁定默认语言为 zh-hans
      - name: Configure Official zh-hans Locale and Patch Lang Resolution
        run: |
          rm -rf "$GITHUB_WORKSPACE/craft-i18n"
          git clone --depth 1 https://github.com/storytold/craft-i18n.git "$GITHUB_WORKSPACE/craft-i18n"

          cat << 'PYEOF' > patch_zh_hans.py
          import os, re, shutil

          # 1. 配置 Cargo.toml 极致体积压缩 Profile
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              filtered = []
              skip = False
              for line in lines:
                  if line.strip().startswith("[profile.release"):
                      skip = True
                      continue
                  if skip and line.strip().startswith("["):
                      skip = False
                  if not skip:
                      filtered.append(line)

              opt_profile = (
                  "\n[profile.release]\n"
                  'opt-level = "z"\n'
                  'lto = "fat"\n'
                  "codegen-units = 1\n"
                  'panic = "abort"\n'
                  "strip = true\n"
                  "debug = 0\n"
              )
              filtered.append(opt_profile)
              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.writelines(filtered)
              print("✅ Cargo.toml Fat LTO 配置完成")

          # 2. 验证官方 zh-hans 词库并补充别名目录
          i18n_repo = os.environ.get("GITHUB_WORKSPACE", "") + "/craft-i18n"
          zh_hans_dir = os.path.join(i18n_repo, "locales", "zh-hans")
          if os.path.exists(zh_hans_dir):
              print("✅ 确认官方简体中文词库完整:", os.listdir(zh_hans_dir))
              for alias in ["zh", "zh-cn", "zh-CN"]:
                  alias_dir = os.path.join(i18n_repo, "locales", alias)
                  if not os.path.exists(alias_dir):
                      shutil.copytree(zh_hans_dir, alias_dir)

          # 3. 全面重定向 crates/ui-egui 下的默认语言与 wasm32 系统探测至 zh-hans
          for root, _, files in os.walk("crates/ui-egui/src"):
              for file in files:
                  if file.endswith(".rs") and "test" not in file and "test" not in root:
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          c = f.read()
                      orig = c

                      # 替换 Lang::EN 默认回退与 wasm32 空探测
                      c = re.sub(
                          r'\.unwrap_or\(\s*Lang::EN\s*\)',
                          '.unwrap_or_else(|| lang_from_tag("zh-hans").unwrap_or(Lang::EN))',
                          c
                      )
                      c = re.sub(
                          r'(target_arch\s*=\s*"wasm32"[^{]*\{\s*)Vec::new\(\)',
                          r'\1vec!["zh-hans".to_owned()]',
                          c,
                          flags=re.DOTALL
                      )
                      c = re.sub(
                          r'(impl\s+Default\s+for\s+Lang\s*\{[^}]*?)Lang::EN',
                          r'\1lang_from_tag("zh-hans").unwrap_or(Lang::EN)',
                          c,
                          flags=re.DOTALL
                      )
                      # 替换首选项默认语言字段
                      c = re.sub(r'(language\s*:\s*String\s*=\s*)"(system|en|auto)"\.into\(\)', r'\1"zh-hans".into()', c)
                      c = re.sub(r'(language\s*:\s*)"(system|en|auto)"\.into\(\)', r'\1"zh-hans".into()', c)
                      c = re.sub(r'(ui_language\s*:\s*)None', r'\1Some("zh-hans".into())', c)
                      c = re.sub(r'(locale\s*:\s*Option<String>\s*=\s*)None', r'\1Some("zh-hans".into())', c)
                      c = c.replace('const ENGLISH_ID: &str = "en";', 'const ENGLISH_ID: &str = "zh-hans";')
                      c = c.replace('const DEFAULT_LANGUAGE: &str = "en";', 'const DEFAULT_LANGUAGE: &str = "zh-hans";')

                      if c != orig:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(c)
                          print(f"✅ 已锁定 zh-hans 默认语言: {path}")

          # 4. 前端 index.html 注入：伪装浏览器语言为 zh-Hans 并清理旧缓存
          for root, _, files in os.walk("apps"):
              for file in files:
                  if file == "index.html":
                      target_html = os.path.join(root, file)
                      with open(target_html, "r", encoding="utf-8") as f:
                          html = f.read()

                      hook_script = (
                          "<script>\n"
                          "(function() {\n"
                          "  try {\n"
                          "    Object.defineProperty(navigator, 'language', { get: function() { return 'zh-Hans'; } });\n"
                          "    Object.defineProperty(navigator, 'languages', { get: function() { return ['zh-Hans', 'zh-CN', 'zh']; } });\n"
                          "    if (localStorage.getItem('filmcraft_zh_hans_v1') !== 'true') {\n"
                          "      localStorage.clear();\n"
                          "      sessionStorage.clear();\n"
                          "      if (window.indexedDB && indexedDB.databases) {\n"
                          "        indexedDB.databases().then(function(dbs) {\n"
                          "          dbs.forEach(function(db) { indexedDB.deleteDatabase(db.name); });\n"
                          "        }).catch(function() {});\n"
                          "      }\n"
                          "      localStorage.setItem('filmcraft_zh_hans_v1', 'true');\n"
                          "    }\n"
                          "    ['filmcraft_language', 'language', 'locale', 'app_lang', 'selected_language', 'ui_language'].forEach(function(k) {\n"
                          "      localStorage.setItem(k, 'zh-hans');\n"
                          "    });\n"
                          "  } catch(e) {}\n"
                          "})();\n"
                          "</script>\n"
                      )
                      if "<head>" in html and "filmcraft_zh_hans_v1" not in html:
                          html = html.replace("<head>", "<head>\n" + hook_script)
                          with open(target_html, "w", encoding="utf-8") as f:
                              f.write(html)
                          print(f"✅ 已在 {target_html} 注入 zh-Hans 重定向与缓存清理脚本")
          PYEOF

          python3 patch_zh_hans.py
          rm -f patch_zh_hans.py

      # 6. 编译 filmcraft-web Wasm 并匹配 Cargo.lock 版本的 wasm-bindgen 打包到 dist/web
      - name: Build FilmCraft WebAssembly Application
        env:
          CARGO_BUILD_JOBS: 2
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
        run: |
          mkdir -p dist/web

          # 提取 Cargo.lock 中锁定的 wasm-bindgen 精确版本
          WBG_VER=$(python3 -c '
          import re
          with open("Cargo.lock", "r", encoding="utf-8") as f:
              txt = f.read()
          m = re.search(r"\[\[package\]\]\s*name = \"wasm-bindgen\"\s*version = \"([^\"]+)\"", txt)
          print(m.group(1) if m else "")
          ')
          echo "检测到 Cargo.lock 锁定的 wasm-bindgen 版本: $WBG_VER"

          # 安装对应版本的 wasm-bindgen-cli
          if [ -n "$WBG_VER" ]; then
            curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG_VER}/wasm-bindgen-${WBG_VER}-x86_64-unknown-linux-musl.tar.gz" -o wbg.tar.gz \
              || curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG_VER}/wasm-bindgen-${WBG_VER}-x86_64-unknown-linux-musl.tar.gz" -o wbg.tar.gz \
              || true
            if [ -f wbg.tar.gz ]; then
              tar -xzf wbg.tar.gz
              sudo cp wasm-bindgen-*/wasm-bindgen /usr/local/bin/
              rm -rf wbg.tar.gz wasm-bindgen-*
            else
              cargo install wasm-bindgen-cli --version "$WBG_VER" --locked
            fi
          fi
          wasm-bindgen --version

          # 编译 filmcraft-web 的 wasm32 release 产物
          cargo build -p filmcraft-web --target wasm32-unknown-unknown --release

          WASM_FILE=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          echo "定位到编译生成的 Wasm: $WASM_FILE"
          if [ -z "$WASM_FILE" ]; then
            echo "❌ 未找到编译生成的 .wasm 文件"
            exit 1
          fi

          # 复制静态前端资源（index.html, audio-worklet.js, favicon.png 等）到 dist/web/
          cp -r apps/filmcraft-web/web/* dist/web/

          # 自动识别 index.html 中引用的 JS 模块名并生成对应胶水代码
          OUT_NAME=$(python3 -c '
          import re, os
          html_path = "dist/web/index.html"
          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()
          m = re.search(r"from\s+[\"\x27]\./([^\"\x27]+)\.js[\"\x27]", html)
          if m:
              print(m.group(1))
          else:
              print("filmcraft_web")
          ')
          echo "目标 JS/Wasm 输出前缀: $OUT_NAME"

          wasm-bindgen --target web --out-dir dist/web --out-name "$OUT_NAME" "$WASM_FILE"

          # 若 index.html 尚未包含模块启动脚本，自动追加初始化脚本
          python3 -c '
          import os
          out_name = os.environ.get("OUT_NAME", "filmcraft_web")
          html_path = "dist/web/index.html"
          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()
          if f"{out_name}.js" not in html:
              boot = f"\n<script type=\"module\">\nimport init from \"./{out_name}.js\";\ninit();\n</script>\n"
              html = html.replace("</body>", boot + "</body>") if "</body>" in html else html + boot
              with open(html_path, "w", encoding="utf-8") as f:
                  f.write(html)
              print(f"✅ 已在 index.html 注入 {out_name}.js 启动脚本")
          ' OUT_NAME="$OUT_NAME"

          echo "=== 检查初步构建产物 ==="
          ls -lh dist/web/

      # 7. 深度压缩 wasm 并执行强制切片（保证单文件小于 20MB，规避 Cloudflare 25MB 限制）
      - name: Compress Wasm & Handle 25MB Cloudflare Limit
        run: |
          echo "=== 开始对所有 wasm 进行极致压缩与切片检测 ==="
          cat << 'PYEOF' > split_wasm.py
          import os, glob, subprocess, json

          wasm_files = glob.glob("dist/web/**/*.wasm", recursive=True)
          if not wasm_files:
              wasm_files = glob.glob("dist/**/*.wasm", recursive=True)
          
          if not wasm_files:
              print("❌ dist 目录下未找到任何 wasm 文件")
              exit(1)

          for wasm_path in wasm_files:
              wasm_dir = os.path.dirname(wasm_path)
              wasm_filename = os.path.basename(wasm_path)
              print(f"\n--- 处理文件: {wasm_filename} ---")
              
              cmd = [
                  "/usr/local/bin/wasm-opt-raw",
                  "--all-features",
                  "--enable-simd",
                  "-Oz",
                  "--strip-debug",
                  "--strip-producers",
                  wasm_path,
                  "-o",
                  wasm_path
              ]
              try:
                  subprocess.run(cmd, check=True)
                  print(f"优化完成，当前大小: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")
              except Exception as e:
                  print(f"wasm-opt 优化过程跳过: {e}")

              size_mb = os.path.getsize(wasm_path) / (1024 * 1024)
              if size_mb > 20.0:
                  print(f"⚠️ 文件体积为 {size_mb:.2f} MB，超过 20MB 安全线，启动自动切片机制...")
                  chunk_size = 10 * 1024 * 1024
                  with open(wasm_path, "rb") as f:
                      data = f.read()

                  chunks = []
                  for i in range(0, len(data), chunk_size):
                      part_name = f"{wasm_filename}.part{len(chunks)}"
                      part_path = os.path.join(wasm_dir, part_name)
                      with open(part_path, "wb") as pf:
                          pf.write(data[i:i+chunk_size])
                      chunks.append(part_name)
                      print(f"  已生成小切片: {part_name} ({len(data[i:i+chunk_size])/(1024*1024):.2f} MB)")

                  os.remove(wasm_path)
                  print(f"✅ 已删除原始超标大文件: {wasm_filename}")

                  html_path = os.path.join(wasm_dir, "index.html")
                  if os.path.exists(html_path):
                      with open(html_path, "r", encoding="utf-8") as f:
                          html = f.read()

                      parts_json_str = json.dumps(chunks)
                      
                      js_lines = [
                          "<script>",
                          "(function() {",
                          "  var origFetch = window.fetch;",
                          '  var targetWasm = "' + wasm_filename + '";',
                          "  var parts = " + parts_json_str + ";",
                          "  window.fetch = async function() {",
                          "    var args = Array.prototype.slice.call(arguments);",
                          "    var url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');",
                          "    if (url.indexOf(targetWasm) !== -1) {",
                          "      console.log('[ChunkLoader] 正在并发获取小分片并透明组装...');",
                          "      var basePath = url.substring(0, url.lastIndexOf('/') + 1);",
                          "      var buffers = await Promise.all(parts.map(function(p) {",
                          "        return origFetch(basePath + p).then(function(r) {",
                          "          if (!r.ok) throw new Error('分片下载失败: ' + p);",
                          "          return r.arrayBuffer();",
                          "        });",
                          "      }));",
                          "      var total = buffers.reduce(function(acc, b) { return acc + b.byteLength; }, 0);",
                          "      var merged = new Uint8Array(total);",
                          "      var offset = 0;",
                          "      for (var i = 0; i < buffers.length; i++) {",
                          "        merged.set(new Uint8Array(buffers[i]), offset);",
                          "        offset += buffers[i].byteLength;",
                          "      }",
                          "      return new Response(merged, { headers: { 'Content-Type': 'application/wasm' } });",
                          "    }",
                          "    return origFetch.apply(this, args);",
                          "  };",
                          "})();",
                          "</script>"
                      ]
                      transparent_loader = "\n".join(js_lines)

                      if "<head>" in html:
                          html = html.replace("<head>", "<head>\n" + transparent_loader)
                      else:
                          html = transparent_loader + "\n" + html

                      with open(html_path, "w", encoding="utf-8") as f:
                          f.write(html)
                      print(f"✅ 已在 {html_path} 中注入透明组装脚本")
              else:
                  print(f"✅ 文件体积安全: {size_mb:.2f} MB (<= 20MB)，无需切片")
          PYEOF

          python3 split_wasm.py
          rm -f split_wasm.py

          echo "=== 最终提交部署的文件列表（确认无任何文件大于 20MB） ==="
          ls -lh dist/web/

      # 8. 部署发布到 Cloudflare Pages (lotelf-pr)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=lotelf-pr --branch=main --commit-dirty=true
