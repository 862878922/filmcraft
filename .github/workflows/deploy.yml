name: Deploy FilmCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，避免 Fat LTO 链接时 OOM (Exit Code 143)
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. 安装现代 Binaryen (wasm-opt v122) 并创建 SIMD 包装器
      - name: Install Modern Binaryen & Setup SIMD Wrapper
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          
          sudo mv /usr/local/bin/wasm-opt /usr/local/bin/wasm-opt-raw
          printf '#!/bin/bash\nexec /usr/local/bin/wasm-opt-raw --all-features --enable-simd "$@"\n' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      # 5. 克隆官方词库与 craft-libs，在 craft-i18n 查词底层强制重定向至 zh-hans
      - name: Patch craft-libs and Enforce Official zh-hans Locale
        run: |
          rm -rf "$GITHUB_WORKSPACE/craft-i18n" vendor_craft_libs
          git clone --depth 1 https://github.com/storytold/craft-i18n.git "$GITHUB_WORKSPACE/craft-i18n"
          git clone https://github.com/storytold/craft-libs.git vendor_craft_libs
          (
            cd vendor_craft_libs
            git checkout df469bb2bd2cc026ad25a34f65954ccbb46909d6 || true
            git checkout 09dcbc225b95232998498a40ca56e24716571d53 -- crates/i18n || true
          )

          cat << 'PYEOF' > patch_zh_hans.py
          import os, re, shutil, tomllib

          # 1. 自动展开 vendor_craft_libs 中所有子 crate 的 .workspace = true 继承
          ws_toml_path = "vendor_craft_libs/Cargo.toml"
          if os.path.exists(ws_toml_path):
              with open(ws_toml_path, "rb") as f:
                  ws_data = tomllib.load(f)
              ws_pkg = ws_data.get("workspace", {}).get("package", {})
              ws_deps = ws_data.get("workspace", {}).get("dependencies", {})

              def toml_val(v):
                  if isinstance(v, bool):
                      return "true" if v else "false"
                  if isinstance(v, str):
                      return f'"{v}"'
                  if isinstance(v, list):
                      return "[" + ", ".join(toml_val(x) for x in v) + "]"
                  if isinstance(v, dict):
                      items = []
                      for dk, dv in v.items():
                          if dk == "path" and isinstance(dv, str) and not dv.startswith("vendor_craft_libs/"):
                              dv = "vendor_craft_libs/" + dv
                          items.append(f"{dk} = {toml_val(dv)}")
                      return "{ " + ", ".join(items) + " }"
                  return str(v)

              crates_root = "vendor_craft_libs/crates"
              if os.path.exists(crates_root):
                  for cname in os.listdir(crates_root):
                      ctoml = os.path.join(crates_root, cname, "Cargo.toml")
                      if not os.path.exists(ctoml):
                          continue
                      with open(ctoml, "r", encoding="utf-8") as f:
                          lines = f.readlines()
                      out_lines = []
                      section = ""
                      for line in lines:
                          s = line.strip()
                          if s.startswith("[") and s.endswith("]"):
                              section = s
                              out_lines.append(line)
                              continue
                          m_ws = re.match(r'^([A-Za-z0-9_-]+)\.workspace\s*=\s*true\s*$', s)
                          m_inline = re.match(r'^([A-Za-z0-9_-]+)\s*=\s*\{([^}]*)\}\s*$', s)
                          if m_ws:
                              key = m_ws.group(1)
                              if section == "[package]":
                                  if key in ws_pkg:
                                      out_lines.append(f"{key} = {toml_val(ws_pkg[key])}\n")
                                  continue
                              elif "dependencies" in section and key in ws_deps:
                                  out_lines.append(f"{key} = {toml_val(ws_deps[key])}\n")
                                  continue
                          elif m_inline and "dependencies" in section and "workspace" in m_inline.group(2):
                              key = m_inline.group(1)
                              if key in ws_deps:
                                  base = dict(ws_deps[key]) if isinstance(ws_deps[key], dict) else {"version": ws_deps[key]}
                                  extra_str = m_inline.group(2)
                                  for part in extra_str.split(","):
                                      part = part.strip()
                                      if "=" in part:
                                          ek, ev = [x.strip() for x in part.split("=", 1)]
                                          if ek != "workspace":
                                              if ek == "features" and "features" in base and ev.startswith("["):
                                                  extra_feats = [x.strip().strip('"').strip("'") for x in ev[1:-1].split(",") if x.strip()]
                                                  base["features"] = list(dict.fromkeys(base["features"] + extra_feats))
                                              else:
                                                  if ev == "true":
                                                      base[ek] = True
                                                  elif ev == "false":
                                                      base[ek] = False
                                                  elif ev.startswith('"') and ev.endswith('"'):
                                                      base[ek] = ev[1:-1]
                                  out_lines.append(f"{key} = {toml_val(base)}\n")
                                  continue
                          out_lines.append(line)
                      with open(ctoml, "w", encoding="utf-8") as f:
                          f.writelines(out_lines)
                  print("✅ 已展开 vendor_craft_libs 子 crate 工作区继承配置")

          # 2. 配置根 Cargo.toml：Fat LTO + [patch] 重定向 craft-i18n 与 craft-web-host
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              filtered = []
              skip = False
              for line in lines:
                  if line.strip().startswith("[profile.release"):
                      skip = True
                      continue
                  if skip and line.strip().startswith("["):
                      skip = False
                  if not skip:
                      filtered.append(line)

              opt_profile = (
                  "\n[profile.release]\n"
                  'opt-level = "z"\n'
                  'lto = "fat"\n'
                  "codegen-units = 1\n"
                  'panic = "abort"\n'
                  "strip = true\n"
                  "debug = 0\n"
              )
              filtered.append(opt_profile)

              patch_entries = []
              if os.path.exists("vendor_craft_libs/crates/i18n/Cargo.toml"):
                  patch_entries.append('craft-i18n = { path = "vendor_craft_libs/crates/i18n" }\n')
              if os.path.exists("vendor_craft_libs/crates/web-host/Cargo.toml"):
                  patch_entries.append('craft-web-host = { path = "vendor_craft_libs/crates/web-host" }\n')
              if patch_entries:
                  filtered.append('\n[patch."https://github.com/storytold/craft-libs"]\n' + "".join(patch_entries))

              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.writelines(filtered)
              print("✅ Cargo.toml 已挂载本地 patch:", [x.split("=")[0].strip() for x in patch_entries])

          # 3. 验证官方 zh-hans 词库并补充别名目录
          i18n_repo = os.environ.get("GITHUB_WORKSPACE", "") + "/craft-i18n"
          zh_hans_dir = os.path.join(i18n_repo, "locales", "zh-hans")
          if os.path.exists(zh_hans_dir):
              print("✅ 确认官方简体中文词库完整:", os.listdir(zh_hans_dir))
              for alias in ["zh", "zh-cn", "zh-CN"]:
                  alias_dir = os.path.join(i18n_repo, "locales", alias)
                  if not os.path.exists(alias_dir):
                      shutil.copytree(zh_hans_dir, alias_dir)

          # 4. 精准修改 vendor_craft_libs/crates/i18n/src/lib.rs：
          #    (a) 默认语言回退直接解析为 zh-hans
          #    (b) 所有文本翻译查询方法在收到 Lang::EN 时自动使用 zh-hans 目录
          i18n_lib = "vendor_craft_libs/crates/i18n/src/lib.rs"
          if os.path.exists(i18n_lib):
              with open(i18n_lib, "r", encoding="utf-8") as f:
                  lib_code = f.read()
              orig_lib = lib_code

              lib_code = lib_code.replace(
                  "find_map(|t| self.match_tag(t)).unwrap_or(Lang::EN)",
                  'find_map(|t| self.match_tag(t)).unwrap_or_else(|| self.match_tag("zh-hans").unwrap_or(Lang::EN))'
              )

              def redirect_en_lookup(m):
                  sig = m.group(0)
                  if re.search(r'\blang\s*:\s*Lang\b', sig):
                      return sig + '\n        let lang = if lang == Lang::EN { self.match_tag("zh-hans").unwrap_or(lang) } else { lang };'
                  return sig

              lib_code = re.sub(
                  r'pub\s+fn\s+(?:get|get_in|trn|trn_in|trn_plain|trn_plain_in)\b[^{]*\{',
                  redirect_en_lookup,
                  lib_code
              )

              if lib_code != orig_lib:
                  with open(i18n_lib, "w", encoding="utf-8") as f:
                      f.write(lib_code)
                  print("✅ 已在 vendor_craft_libs/crates/i18n/src/lib.rs 注入 zh-hans 默认解析与查词重定向")
              else:
                  print("⚠️ lib.rs 未匹配到预期签名，输出 330-450 行排查:")
                  for idx, ln in enumerate(lib_code.splitlines()[329:450], 330):
                      print(f"{idx}: {ln}")

          # 5. 穿透修改 vendor_craft_libs、crates/ 与 apps/ 下的所有非测试 Rust 源码
          def patch_rust_tree(base_dir):
              if not os.path.exists(base_dir):
                  return
              for root, _, files in os.walk(base_dir):
                  if "test" in root:
                      continue
                  for file in files:
                      if file.endswith(".rs") and "test" not in file:
                          path = os.path.join(root, file)
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          orig = c

                          if "lang_from_tag" in c:
                              c = re.sub(
                                  r'\.unwrap_or\(\s*Lang::EN\s*\)',
                                  '.unwrap_or_else(|| lang_from_tag("zh-hans").unwrap_or(Lang::EN))',
                                  c
                              )
                              c = re.sub(
                                  r'(impl\s+Default\s+for\s+Lang\s*\{[^}]*?)Lang::EN',
                                  r'\1lang_from_tag("zh-hans").unwrap_or(Lang::EN)',
                                  c,
                                  flags=re.DOTALL
                              )

                          c = re.sub(
                              r'(target_arch\s*=\s*"wasm32"[^{]*\{\s*)Vec::new\(\)',
                              r'\1vec!["zh-hans".to_owned()]',
                              c,
                              flags=re.DOTALL
                          )
                          c = re.sub(r'(language\s*:\s*String\s*=\s*)"(system|en|auto)"\.into\(\)', r'\1"zh-hans".into()', c)
                          c = re.sub(r'(language\s*:\s*)"(system|en|auto)"\.into\(\)', r'\1"zh-hans".into()', c)
                          c = re.sub(r'(ui_language\s*:\s*)None', r'\1Some("zh-hans".into())', c)
                          c = re.sub(r'(locale\s*:\s*Option<String>\s*=\s*)None', r'\1Some("zh-hans".into())', c)
                          c = c.replace('const ENGLISH_ID: &str = "en";', 'const ENGLISH_ID: &str = "zh-hans";')
                          c = c.replace('const DEFAULT_LANGUAGE: &str = "en";', 'const DEFAULT_LANGUAGE: &str = "zh-hans";')
                          if "web-host" in path or "filmcraft-web" in path:
                              c = c.replace('"en-US"', '"zh-Hans"').replace('"en"', '"zh-hans"')

                          if c != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                              print(f"✅ 已锁定 zh-hans 默认语言: {path}")

          patch_rust_tree("vendor_craft_libs/crates/i18n")
          patch_rust_tree("vendor_craft_libs/crates/web-host")
          patch_rust_tree("crates")
          patch_rust_tree("apps")

          # 6. 前端 index.html 注入：伪装浏览器语言为 zh-Hans 并清理旧缓存
          for root, _, files in os.walk("apps"):
              for file in files:
                  if file == "index.html":
                      target_html = os.path.join(root, file)
                      with open(target_html, "r", encoding="utf-8") as f:
                          html = f.read()

                      hook_script = (
                          "<script>\n"
                          "(function() {\n"
                          "  try {\n"
                          "    Object.defineProperty(navigator, 'language', { get: function() { return 'zh-Hans'; } });\n"
                          "    Object.defineProperty(navigator, 'languages', { get: function() { return ['zh-Hans', 'zh-CN', 'zh']; } });\n"
                          "    if (localStorage.getItem('filmcraft_zh_hans_v4') !== 'true') {\n"
                          "      localStorage.clear();\n"
                          "      sessionStorage.clear();\n"
                          "      localStorage.setItem('filmcraft_zh_hans_v4', 'true');\n"
                          "      if (window.indexedDB && indexedDB.databases) {\n"
                          "        indexedDB.databases().then(function(dbs) {\n"
                          "          if (dbs && dbs.length > 0) {\n"
                          "            Promise.all(dbs.map(function(db) {\n"
                          "              return new Promise(function(res) {\n"
                          "                var req = indexedDB.deleteDatabase(db.name);\n"
                          "                req.onsuccess = req.onerror = req.onblocked = res;\n"
                          "              });\n"
                          "            })).then(function() { location.reload(); });\n"
                          "          }\n"
                          "        }).catch(function() {});\n"
                          "      }\n"
                          "    }\n"
                          "    ['filmcraft_language', 'language', 'locale', 'app_lang', 'selected_language', 'ui_language'].forEach(function(k) {\n"
                          "      localStorage.setItem(k, 'zh-hans');\n"
                          "    });\n"
                          "  } catch(e) {}\n"
                          "})();\n"
                          "</script>\n"
                      )
                      if "<head>" in html and "filmcraft_zh_hans_v4" not in html:
                          html = html.replace("<head>", "<head>\n" + hook_script)
                          with open(target_html, "w", encoding="utf-8") as f:
                              f.write(html)
                          print(f"✅ 已在 {target_html} 注入 zh-Hans 重定向与同步清库脚本")
          PYEOF

          python3 patch_zh_hans.py
          rm -f patch_zh_hans.py

      # 6. 编译 filmcraft-web Wasm 并匹配 Cargo.lock 版本的 wasm-bindgen 打包到 dist/web
      - name: Build FilmCraft WebAssembly Application
        env:
          CARGO_BUILD_JOBS: 2
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
        run: |
          mkdir -p dist/web

          WBG_VER=$(python3 -c '
          import re
          with open("Cargo.lock", "r", encoding="utf-8") as f:
              txt = f.read()
          m = re.search(r"\[\[package\]\]\s*name = \"wasm-bindgen\"\s*version = \"([^\"]+)\"", txt)
          print(m.group(1) if m else "")
          ')
          echo "检测到 Cargo.lock 锁定的 wasm-bindgen 版本: $WBG_VER"

          if [ -n "$WBG_VER" ]; then
            curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG_VER}/wasm-bindgen-${WBG_VER}-x86_64-unknown-linux-musl.tar.gz" -o wbg.tar.gz \
              || curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG_VER}/wasm-bindgen-${WBG_VER}-x86_64-unknown-linux-musl.tar.gz" -o wbg.tar.gz \
              || true
            if [ -f wbg.tar.gz ]; then
              tar -xzf wbg.tar.gz
              sudo cp wasm-bindgen-*/wasm-bindgen /usr/local/bin/
              rm -rf wbg.tar.gz wasm-bindgen-*
            else
              cargo install wasm-bindgen-cli --version "$WBG_VER" --locked
            fi
          fi
          wasm-bindgen --version

          cargo build -p filmcraft-web --target wasm32-unknown-unknown --release

          WASM_FILE=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          echo "定位到编译生成的 Wasm: $WASM_FILE"
          if [ -z "$WASM_FILE" ]; then
            echo "❌ 未找到编译生成的 .wasm 文件"
            exit 1
          fi

          cp -r apps/filmcraft-web/web/* dist/web/

          OUT_NAME=$(python3 -c '
          import re
          with open("dist/web/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          m = re.search(r"[\"\x27]\./([^\"\x27]+)\.js[\"\x27]", html)
          print(m.group(1) if m else "filmcraft_web")
          ')
          echo "目标 JS/Wasm 输出前缀: $OUT_NAME"

          wasm-bindgen --target web --out-dir dist/web --out-name "$OUT_NAME" "$WASM_FILE"

          echo "=== 检查初步构建产物 ==="
          ls -lh dist/web/

      # 7. 深度压缩 wasm 并执行强制切片（支持 string / URL / Request 拦截，保证单文件小于 20MB）
      - name: Compress Wasm & Handle 25MB Cloudflare Limit
        run: |
          echo "=== 开始对所有 wasm 进行极致压缩与切片检测 ==="
          cat << 'PYEOF' > split_wasm.py
          import os, glob, subprocess, json

          wasm_files = glob.glob("dist/web/**/*.wasm", recursive=True)
          if not wasm_files:
              wasm_files = glob.glob("dist/**/*.wasm", recursive=True)
          
          if not wasm_files:
              print("❌ dist 目录下未找到任何 wasm 文件")
              exit(1)

          for wasm_path in wasm_files:
              wasm_dir = os.path.dirname(wasm_path)
              wasm_filename = os.path.basename(wasm_path)
              print(f"\n--- 处理文件: {wasm_filename} ---")
              
              cmd = [
                  "/usr/local/bin/wasm-opt-raw",
                  "--all-features",
                  "--enable-simd",
                  "-Oz",
                  "--strip-debug",
                  "--strip-producers",
                  wasm_path,
                  "-o",
                  wasm_path
              ]
              try:
                  subprocess.run(cmd, check=True)
                  print(f"优化完成，当前大小: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")
              except Exception as e:
                  print(f"wasm-opt 优化过程跳过: {e}")

              size_mb = os.path.getsize(wasm_path) / (1024 * 1024)
              if size_mb > 20.0:
                  print(f"⚠️ 文件体积为 {size_mb:.2f} MB，超过 20MB 安全线，启动自动切片机制...")
                  chunk_size = 10 * 1024 * 1024
                  with open(wasm_path, "rb") as f:
                      data = f.read()

                  chunks = []
                  for i in range(0, len(data), chunk_size):
                      part_name = f"{wasm_filename}.part{len(chunks)}"
                      part_path = os.path.join(wasm_dir, part_name)
                      with open(part_path, "wb") as pf:
                          pf.write(data[i:i+chunk_size])
                      chunks.append(part_name)
                      print(f"  已生成小切片: {part_name} ({len(data[i:i+chunk_size])/(1024*1024):.2f} MB)")

                  os.remove(wasm_path)
                  print(f"✅ 已删除原始超标大文件: {wasm_filename}")

                  html_path = os.path.join(wasm_dir, "index.html")
                  if os.path.exists(html_path):
                      with open(html_path, "r", encoding="utf-8") as f:
                          html = f.read()

                      parts_json_str = json.dumps(chunks)
                      
                      js_lines = [
                          "<script>",
                          "(function() {",
                          "  var origFetch = window.fetch;",
                          '  var targetWasm = "' + wasm_filename + '";',
                          "  var parts = " + parts_json_str + ";",
                          "  window.fetch = async function() {",
                          "    var args = Array.prototype.slice.call(arguments);",
                          "    var raw = args[0];",
                          "    var url = typeof raw === 'string' ? raw : (raw && (raw.href || raw.url) ? (raw.href || raw.url) : String(raw || ''));",
                          "    if (url.indexOf(targetWasm) !== -1) {",
                          "      console.log('[ChunkLoader] 正在并发获取小分片并透明组装...');",
                          "      var cleanUrl = url.split('?')[0].split('#')[0];",
                          "      var basePath = cleanUrl.substring(0, cleanUrl.lastIndexOf('/') + 1);",
                          "      var buffers = await Promise.all(parts.map(function(p) {",
                          "        return origFetch(basePath + p).then(function(r) {",
                          "          if (!r.ok) throw new Error('分片下载失败: ' + p);",
                          "          return r.arrayBuffer();",
                          "        });",
                          "      }));",
                          "      var total = buffers.reduce(function(acc, b) { return acc + b.byteLength; }, 0);",
                          "      var merged = new Uint8Array(total);",
                          "      var offset = 0;",
                          "      for (var i = 0; i < buffers.length; i++) {",
                          "        merged.set(new Uint8Array(buffers[i]), offset);",
                          "        offset += buffers[i].byteLength;",
                          "      }",
                          "      return new Response(merged, { status: 200, headers: { 'Content-Type': 'application/wasm' } });",
                          "    }",
                          "    return origFetch.apply(this, args);",
                          "  };",
                          "})();",
                          "</script>"
                      ]
                      transparent_loader = "\n".join(js_lines)

                      if "<head>" in html:
                          html = html.replace("<head>", "<head>\n" + transparent_loader)
                      else:
                          html = transparent_loader + "\n" + html

                      with open(html_path, "w", encoding="utf-8") as f:
                          f.write(html)
                      print(f"✅ 已在 {html_path} 中注入透明组装脚本")
              else:
                  print(f"✅ 文件体积安全: {size_mb:.2f} MB (<= 20MB)，无需切片")
          PYEOF

          python3 split_wasm.py
          rm -f split_wasm.py

          echo "=== 最终提交部署的文件列表（确认无任何文件大于 20MB） ==="
          ls -lh dist/web/

      # 8. 部署发布到 Cloudflare Pages (lotelf-pr)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
